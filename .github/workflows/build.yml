name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unpack newest project zip
        run: |
          newest=$(git log --name-only --diff-filter=AM --pretty=format: -- '*.zip' | while IFS= read -r f; do if [ -n "$f" ] && [ -f "$f" ]; then echo "$f"; break; fi; done)
          echo "Using: $newest"
          unzip -o "$newest" -d proj
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        working-directory: proj
        run: gradle assembleDebug --no-daemon
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ github.run_number }}" proj/app/build/outputs/apk/debug/app-debug.apk --title "Kitchen app v${{ github.run_number }}" --notes "Install this APK on the kitchen phone"
